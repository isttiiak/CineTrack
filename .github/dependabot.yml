# Keeps dependencies and CI actions current with as little noise as possible:
# one grouped pull request a month. CI must pass before merging; major upgrades are reviewed by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # No major bumps through Dependabot. Majors (React 19, Tailwind 4, ESLint 10, TypeScript 7,
      # lucide-react, react-day-picker, ...) are planned migrations done by hand with a visual check.
      # Companion packages (@eslint/js, eslint-plugin-react-hooks) break if upgraded alone, so a blanket
      # rule is safer than naming each package. Minor and patch updates keep arriving, grouped.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
