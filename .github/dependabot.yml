# Keeps dependencies and CI actions current with as little noise as possible:
# one grouped pull request a month. CI must pass before merging; major upgrades are reviewed by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Held back on purpose: these are major migrations (React 19, Tailwind 4, ESLint 10, TypeScript 7).
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react*"
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node types must match the runtime (Node 22, see .nvmrc), not the newest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # Icon library majors can rename or remove icons: upgrade by hand and check the UI.
      - dependency-name: lucide-react
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
